name: Contract Testing Pipeline

on:
  push:
  pull_request:

jobs:

  contract-tests:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Run Playwright Tests
      run: npx playwright test

    - name: Run Pact Verification
      run: npx ts-node tests/contract/providerVerification.spec.ts